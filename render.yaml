# Staging preview; use a separate MongoDB database with test data.
services:
  - type: web
    name: welearn-cms-preview
    runtime: docker
    repo: https://github.com/rosajaim/CIT366Projects
    branch: production-readiness
    rootDir: cms
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    # Render supplies PORT and RENDER_EXTERNAL_URL automatically.
