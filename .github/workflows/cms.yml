name: CMS checks
on:
  pull_request:
    paths: ['cms/**', '.github/workflows/cms.yml']
  push:
    paths: ['cms/**', '.github/workflows/cms.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    services:
      mongo:
        image: mongo:7
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:api
      - run: CHROME_BIN=$(command -v google-chrome) npm run test:e2e
      - run: npm audit --audit-level=high
      - run: docker build -t welearn-cms:ci .
